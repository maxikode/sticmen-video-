services:
  - type: web
    name: stickman-video-renderer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MCP_PATH_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://sticmen-video.onrender.com
      - key: PROJECTS_DIR
        value: /tmp/stickman-projects
      - key: GEMINI_API_KEY
        sync: false
