services:
  - type: web
    name: stickman-video-renderer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MCP_PATH_TOKEN
        value: d1f6a354f28706d1f45d7520e19855b3a216973690b0f3a7558522b1443190ef
      - key: PUBLIC_BASE_URL
        value: https://sticmen-video.onrender.com
      - key: PROJECTS_DIR
        value: /tmp/stickman-projects
      - key: GEMINI_API_KEY
        sync: false
